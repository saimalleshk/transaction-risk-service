
name: Transaction Risk Service CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify test collection
        run: |
          python -m pytest --collect-only -q > /tmp/pytest-collection.txt
          cat /tmp/pytest-collection.txt
          grep -Eq '[1-9][0-9]* tests? collected' /tmp/pytest-collection.txt

      - name: Run tests
        run: python -m pytest -v --strict-config --strict-markers

  helm-validation:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint ./transaction-risk

      - name: Render Kubernetes manifests
        run: |
          helm template transaction-risk-ci ./transaction-risk \
            > /tmp/transaction-risk-rendered.yaml
          test -s /tmp/transaction-risk-rendered.yaml
          cat /tmp/transaction-risk-rendered.yaml

  publish-image:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - helm-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
