
name: Transaction Risk Service CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify test collection
        run: |
          python -m pytest --collect-only -q > /tmp/pytest-collection.txt
          cat /tmp/pytest-collection.txt
          grep -Eq '[1-9][0-9]* tests? collected' /tmp/pytest-collection.txt

      - name: Run tests
        run: python -m pytest -v --strict-config --strict-markers

  helm-validation:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint ./transaction-risk

      - name: Render Kubernetes manifests
        run: |
          helm template transaction-risk-ci ./transaction-risk \
            > /tmp/transaction-risk-rendered.yaml
          test -s /tmp/transaction-risk-rendered.yaml
          cat /tmp/transaction-risk-rendered.yaml
