apiVersion: v1
kind: Service
metadata:
  name: {{ include "transaction-risk.fullname" . }}-service
  labels:
    app: transaction-risk-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: transaction-risk-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
