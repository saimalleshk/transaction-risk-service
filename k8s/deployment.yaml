
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-risk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-risk-api
  template:
    metadata:
      labels:
        app: transaction-risk-api
    spec:
      containers:
        - name: api
          image: transaction-risk-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
